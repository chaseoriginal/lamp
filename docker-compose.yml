services:
  db1:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${VOLUME_DB}:/docker-entrypoint-initdb.d
      - lamp_mysql_datadir:/var/lib/mysql
    ports:
      - ${IP}:${DBPORT}:${DBPORT}
    networks:
      - lamp
  web1:
    depends_on:
      - db1
    image: php:8.1.1-apache
    restart: always
    volumes:
      - ${VOLUME_WEB}:/var/www/html
    ports:
      - ${IP}:${SWEBPORT}:${SWEBPORT}
    networks:
      - lamp
  phpmyadmin1:
    depends_on:
      - db1
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - ${IP}:${PHPMAEXTPORT}:${PHPMAINTPORT}
    environment:
      - PMA_HOST=${PMA_HOST}
      - PMA_PORT=${PMA_PORT}
    networks:
      - lamp
networks:
  lamp:
    driver: bridge
volumes:
  lamp_mysql_datadir:
    external: true
    name: cec35905f9f248776a850cdc0609f1e3e4cab3c1b6c63567f17c54748afe3874
